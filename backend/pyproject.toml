[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-single-shop-backend"
version = "0.1.0"
description = "Backend foundation for a single-shop TikTok Shop management system"
requires-python = ">=3.11"
dependencies = [
    "cryptography",
    "fastapi",
    "httpx",
    "pydantic-settings",
    "sqlalchemy",
    "aiosqlite",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "collector_app*", "shared*", "migrations*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["app", "collector_app", "shared", "tests"]
exclude = [".venv"]
pythonVersion = "3.11"
typeCheckingMode = "basic"